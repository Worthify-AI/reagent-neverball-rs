[package]
name = "reagent-neverball-rs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A source-withheld reconstruction of one licensed Neverball course, with Worthify presentation"
[dependencies]
macroquad = { version = "=0.4.14", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
