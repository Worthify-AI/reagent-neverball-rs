[package]
name = "reagent-neverball-rs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A Worthify-assisted Neverball engine reconstruction from executable evidence and licensed runtime data"
[dependencies]
image = { version = "=0.24.9", default-features = false, features = ["jpeg"] }
macroquad = { version = "=0.4.14", default-features = false, features = ["audio"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
